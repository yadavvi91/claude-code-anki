<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Inter','Segoe UI',sans-serif">
  <rect width="800" height="420" rx="12" fill="#15171e"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#e2e5ed" font-size="16" font-weight="600">The Coding Agent Tool Loop</text>

  <!-- Boxes -->
  <!-- User -->
  <rect x="30" y="70" width="120" height="50" rx="8" fill="#1e2030" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="90" y="100" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="600">User</text>

  <!-- Agent -->
  <rect x="230" y="70" width="140" height="50" rx="8" fill="#1e2030" stroke="#6366f1" stroke-width="1.5"/>
  <text x="300" y="100" text-anchor="middle" fill="#818cf8" font-size="13" font-weight="600">Coding Agent</text>

  <!-- LLM -->
  <rect x="460" y="70" width="140" height="50" rx="8" fill="#1e2030" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="530" y="100" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">Claude (LLM)</text>

  <!-- Tools -->
  <rect x="640" y="70" width="130" height="50" rx="8" fill="#1e2030" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="705" y="100" text-anchor="middle" fill="#2dd4bf" font-size="13" font-weight="600">Tools</text>

  <!-- Step 1: User -> Agent -->
  <line x1="150" y1="95" x2="225" y2="95" stroke="#4a5068" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="155" y="57" width="65" height="20" rx="4" fill="#1e2030"/>
  <text x="187" y="71" text-anchor="middle" fill="#9ca3af" font-size="10">1. Task</text>

  <!-- Step 2: Agent -> LLM (with tools) -->
  <line x1="370" y1="85" x2="455" y2="85" stroke="#4a5068" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="370" y="57" width="85" height="20" rx="4" fill="#1e2030"/>
  <text x="412" y="71" text-anchor="middle" fill="#9ca3af" font-size="10">2. Query + Tools</text>

  <!-- The loop section -->
  <rect x="200" y="150" width="570" height="240" rx="10" fill="none" stroke="#374151" stroke-width="1" stroke-dasharray="6,4"/>
  <rect x="215" y="140" width="100" height="20" rx="4" fill="#15171e"/>
  <text x="265" y="154" text-anchor="middle" fill="#6b7280" font-size="11" font-weight="500">TOOL LOOP</text>

  <!-- Step 3: LLM decides tool -->
  <rect x="440" y="175" width="180" height="44" rx="6" fill="#1e2030" stroke="#f59e0b" stroke-width="1"/>
  <text x="530" y="193" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="500">3. LLM responds:</text>
  <text x="530" y="210" text-anchor="middle" fill="#e2e5ed" font-size="11" font-family="'JetBrains Mono',monospace">"ReadFile: main.go"</text>

  <!-- Step 4: Agent executes tool -->
  <line x1="530" y1="219" x2="530" y2="250" stroke="#4a5068" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="440" y="255" width="180" height="44" rx="6" fill="#1e2030" stroke="#6366f1" stroke-width="1"/>
  <text x="530" y="273" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="500">4. Agent executes tool</text>
  <text x="530" y="290" text-anchor="middle" fill="#e2e5ed" font-size="11" font-family="'JetBrains Mono',monospace">Read("main.go")</text>

  <!-- Step 5: Tool returns result -->
  <line x1="530" y1="299" x2="530" y2="325" stroke="#4a5068" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="440" y="330" width="180" height="44" rx="6" fill="#1e2030" stroke="#14b8a6" stroke-width="1"/>
  <text x="530" y="348" text-anchor="middle" fill="#2dd4bf" font-size="11" font-weight="500">5. Result returned to LLM</text>
  <text x="530" y="365" text-anchor="middle" fill="#e2e5ed" font-size="11" font-family="'JetBrains Mono',monospace">file contents...</text>

  <!-- Loop back arrow -->
  <path d="M440,355 L280,355 L280,197 L440,197" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <rect x="260" y="262" width="50" height="20" rx="4" fill="#15171e"/>
  <text x="285" y="276" text-anchor="middle" fill="#6b7280" font-size="10">repeat</text>

  <!-- Final: LLM -> Agent -> User -->
  <rect x="230" y="175" width="160" height="44" rx="6" fill="#1e2030" stroke="#059669" stroke-width="1"/>
  <text x="310" y="193" text-anchor="middle" fill="#34d399" font-size="11" font-weight="500">6. Final text response</text>
  <text x="310" y="210" text-anchor="middle" fill="#e2e5ed" font-size="11">"The file contains..."</text>

  <!-- Arrow defs -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5068"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
