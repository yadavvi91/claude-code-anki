<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="'Inter','Segoe UI',sans-serif">
  <rect width="800" height="350" rx="12" fill="#15171e"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#e2e5ed" font-size="16" font-weight="600">Subagent Context Isolation</text>

  <!-- Main Context Window -->
  <rect x="40" y="60" width="320" height="270" rx="10" fill="#1e2030" stroke="#6366f1" stroke-width="1.5"/>
  <text x="200" y="85" text-anchor="middle" fill="#818cf8" font-size="13" font-weight="600">Main Context Window</text>

  <!-- Messages in main context -->
  <rect x="60" y="100" width="280" height="28" rx="4" fill="#252840"/>
  <text x="70" y="119" fill="#e2e5ed" font-size="11">User: "How does auth work?"</text>

  <rect x="60" y="135" width="280" height="28" rx="4" fill="#252840"/>
  <text x="70" y="154" fill="#e2e5ed" font-size="11">Claude: Delegating to Explore agent...</text>

  <rect x="60" y="200" width="280" height="28" rx="4" fill="#252840" stroke="#059669" stroke-width="1"/>
  <text x="70" y="219" fill="#34d399" font-size="11">Summary: "JWT validated in auth.js:42"</text>

  <text x="200" y="260" text-anchor="middle" fill="#6b7280" font-size="10">Only question + summary in context</text>
  <text x="200" y="275" text-anchor="middle" fill="#6b7280" font-size="10">Context stays clean</text>

  <!-- Arrow from main to subagent -->
  <line x1="360" y1="140" x2="430" y2="140" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#sa)"/>
  <text x="395" y="130" text-anchor="middle" fill="#fbbf24" font-size="10">task</text>

  <!-- Arrow from subagent to main -->
  <line x1="430" y1="205" x2="360" y2="205" stroke="#059669" stroke-width="1.5" marker-end="url(#sa)"/>
  <text x="395" y="222" text-anchor="middle" fill="#34d399" font-size="10">summary</text>

  <!-- Subagent Context Window -->
  <rect x="440" y="60" width="330" height="270" rx="10" fill="#1e2030" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="605" y="85" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">Subagent Context (temporary)</text>

  <!-- Messages in subagent -->
  <rect x="460" y="100" width="290" height="24" rx="4" fill="#252840"/>
  <text x="470" y="117" fill="#9ca3af" font-size="10">System: You are an Explore agent...</text>

  <rect x="460" y="130" width="290" height="24" rx="4" fill="#252840"/>
  <text x="470" y="147" fill="#9ca3af" font-size="10">Task: Find where auth is handled</text>

  <rect x="460" y="160" width="290" height="24" rx="4" fill="#252840"/>
  <text x="470" y="177" fill="#9ca3af" font-size="10">Grep("JWT") -> 3 files found</text>

  <rect x="460" y="190" width="290" height="24" rx="4" fill="#252840"/>
  <text x="470" y="207" fill="#9ca3af" font-size="10">Read("middleware/auth.js") -> 120 lines</text>

  <rect x="460" y="220" width="290" height="24" rx="4" fill="#252840"/>
  <text x="470" y="237" fill="#9ca3af" font-size="10">Read("routes/api.js") -> 85 lines</text>

  <rect x="460" y="250" width="290" height="24" rx="4" fill="#252840"/>
  <text x="470" y="267" fill="#9ca3af" font-size="10">Read("config/auth.json") -> 15 lines</text>

  <!-- Discarded label -->
  <text x="605" y="305" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="500">Discarded after completion</text>
  <text x="605" y="320" text-anchor="middle" fill="#6b7280" font-size="10">All intermediate work gone</text>

  <defs>
    <marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5068"/>
    </marker>
  </defs>
</svg>
