<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Inter','Segoe UI',sans-serif">
  <rect width="800" height="380" rx="12" fill="#15171e"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#e2e5ed" font-size="16" font-weight="600">Hook Interception: PreToolUse &amp; PostToolUse</text>

  <!-- Normal flow (top) -->
  <text x="50" y="72" fill="#6b7280" font-size="11" font-weight="500">NORMAL FLOW (no hooks)</text>

  <rect x="50" y="85" width="110" height="40" rx="6" fill="#1e2030" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="105" y="110" text-anchor="middle" fill="#fbbf24" font-size="12">LLM decides</text>

  <line x1="160" y1="105" x2="220" y2="105" stroke="#4a5068" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="225" y="85" width="130" height="40" rx="6" fill="#1e2030" stroke="#6366f1" stroke-width="1.5"/>
  <text x="290" y="110" text-anchor="middle" fill="#818cf8" font-size="12">Agent runs tool</text>

  <line x1="355" y1="105" x2="415" y2="105" stroke="#4a5068" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="420" y="85" width="130" height="40" rx="6" fill="#1e2030" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="485" y="110" text-anchor="middle" fill="#2dd4bf" font-size="12">Result to LLM</text>

  <!-- Hook flow (bottom) -->
  <text x="50" y="170" fill="#6b7280" font-size="11" font-weight="500">WITH HOOKS</text>

  <!-- LLM decides -->
  <rect x="50" y="190" width="100" height="40" rx="6" fill="#1e2030" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="100" y="215" text-anchor="middle" fill="#fbbf24" font-size="11">LLM decides</text>

  <line x1="150" y1="210" x2="195" y2="210" stroke="#4a5068" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- PreToolUse -->
  <rect x="200" y="185" width="130" height="50" rx="6" fill="#1e2030" stroke="#f97316" stroke-width="2"/>
  <text x="265" y="206" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="600">PreToolUse</text>
  <text x="265" y="224" text-anchor="middle" fill="#9ca3af" font-size="10">can block/modify</text>

  <!-- Block path -->
  <line x1="265" y1="235" x2="265" y2="280" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="215" y="285" width="100" height="32" rx="6" fill="#1e2030" stroke="#dc2626" stroke-width="1.5"/>
  <text x="265" y="305" text-anchor="middle" fill="#ef4444" font-size="11">BLOCKED</text>
  <text x="265" y="340" text-anchor="middle" fill="#6b7280" font-size="10">Tool never executes.</text>
  <text x="265" y="355" text-anchor="middle" fill="#6b7280" font-size="10">Error returned to LLM.</text>

  <!-- Continue path -->
  <line x1="330" y1="210" x2="385" y2="210" stroke="#4a5068" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="357" y="200" text-anchor="middle" fill="#34d399" font-size="9">pass</text>

  <!-- Tool executes -->
  <rect x="390" y="190" width="110" height="40" rx="6" fill="#1e2030" stroke="#6366f1" stroke-width="1.5"/>
  <text x="445" y="215" text-anchor="middle" fill="#818cf8" font-size="11">Tool executes</text>

  <line x1="500" y1="210" x2="545" y2="210" stroke="#4a5068" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- PostToolUse -->
  <rect x="550" y="185" width="130" height="50" rx="6" fill="#1e2030" stroke="#f97316" stroke-width="2"/>
  <text x="615" y="206" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="600">PostToolUse</text>
  <text x="615" y="224" text-anchor="middle" fill="#9ca3af" font-size="10">can modify result</text>

  <line x1="680" y1="210" x2="720" y2="210" stroke="#4a5068" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Result to LLM -->
  <rect x="725" y="190" width="55" height="40" rx="6" fill="#1e2030" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="752" y="215" text-anchor="middle" fill="#2dd4bf" font-size="11">LLM</text>

  <!-- PostToolUse modify path -->
  <line x1="615" y1="235" x2="615" y2="280" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="555" y="285" width="120" height="32" rx="6" fill="#1e2030" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="615" y="305" text-anchor="middle" fill="#fbbf24" font-size="11">MODIFIED</text>
  <text x="615" y="340" text-anchor="middle" fill="#6b7280" font-size="10">Result altered before</text>
  <text x="615" y="355" text-anchor="middle" fill="#6b7280" font-size="10">reaching LLM.</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5068"/>
    </marker>
  </defs>
</svg>
