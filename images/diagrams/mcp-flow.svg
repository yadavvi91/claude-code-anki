<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Inter','Segoe UI',sans-serif">
  <rect width="800" height="400" rx="12" fill="#15171e"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#e2e5ed" font-size="16" font-weight="600">MCP Client-Server Communication Flow</text>

  <!-- Boxes across the top -->
  <!-- User -->
  <rect x="30" y="60" width="100" height="45" rx="8" fill="#1e2030" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="87" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">User</text>

  <!-- Your Server -->
  <rect x="190" y="60" width="120" height="45" rx="8" fill="#1e2030" stroke="#6366f1" stroke-width="1.5"/>
  <text x="250" y="87" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="600">Your Server</text>

  <!-- MCP Client -->
  <rect x="370" y="60" width="110" height="45" rx="8" fill="#1e2030" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="425" y="87" text-anchor="middle" fill="#2dd4bf" font-size="12" font-weight="600">MCP Client</text>

  <!-- MCP Server -->
  <rect x="540" y="60" width="110" height="45" rx="8" fill="#1e2030" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="595" y="87" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">MCP Server</text>

  <!-- Claude -->
  <rect x="190" y="340" width="120" height="45" rx="8" fill="#1e2030" stroke="#f97316" stroke-width="1.5"/>
  <text x="250" y="367" text-anchor="middle" fill="#fb923c" font-size="12" font-weight="600">Claude</text>

  <!-- GitHub -->
  <rect x="680" y="60" width="90" height="45" rx="8" fill="#1e2030" stroke="#ec4899" stroke-width="1.5"/>
  <text x="725" y="87" text-anchor="middle" fill="#f472b6" font-size="12" font-weight="600">GitHub</text>

  <!-- Vertical lines (swimlanes) -->
  <line x1="80" y1="105" x2="80" y2="330" stroke="#1e2030" stroke-width="1" stroke-dasharray="3,5"/>
  <line x1="250" y1="105" x2="250" y2="330" stroke="#1e2030" stroke-width="1" stroke-dasharray="3,5"/>
  <line x1="425" y1="105" x2="425" y2="330" stroke="#1e2030" stroke-width="1" stroke-dasharray="3,5"/>
  <line x1="595" y1="105" x2="595" y2="330" stroke="#1e2030" stroke-width="1" stroke-dasharray="3,5"/>
  <line x1="725" y1="105" x2="725" y2="330" stroke="#1e2030" stroke-width="1" stroke-dasharray="3,5"/>

  <!-- Step 1: User -> Server -->
  <line x1="80" y1="125" x2="245" y2="125" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="160" y="118" text-anchor="middle" fill="#9ca3af" font-size="10">1. "What repos do I have?"</text>

  <!-- Step 2: Server -> MCP Client (list tools) -->
  <line x1="250" y1="150" x2="420" y2="150" stroke="#818cf8" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="335" y="143" text-anchor="middle" fill="#9ca3af" font-size="10">2. list_tools()</text>

  <!-- Step 3: MCP Client -> MCP Server -->
  <line x1="425" y1="170" x2="590" y2="170" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="507" y="163" text-anchor="middle" fill="#9ca3af" font-size="10">3. ListToolsRequest</text>

  <!-- Step 4: MCP Server -> MCP Client (tools list) -->
  <line x1="590" y1="190" x2="430" y2="190" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="507" y="206" text-anchor="middle" fill="#9ca3af" font-size="10">4. ListToolsResult</text>

  <!-- Step 5: Server -> Claude (query + tools) -->
  <line x1="250" y1="220" x2="250" y2="335" stroke="#818cf8" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="237" y="275" text-anchor="end" fill="#9ca3af" font-size="10">5. query + tools</text>

  <!-- Step 6: Claude -> Server (tool_use) -->
  <line x1="255" y1="340" x2="255" y2="225" stroke="#fb923c" stroke-width="1.5" marker-end="url(#a1)" stroke-dasharray="4,2"/>
  <text x="268" y="275" fill="#9ca3af" font-size="10">6. tool_use: get_repos</text>

  <!-- Step 7: Server -> Client -> Server -> GitHub -->
  <line x1="255" y1="230" x2="420" y2="230" stroke="#818cf8" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="335" y="245" text-anchor="middle" fill="#9ca3af" font-size="10">7. call_tool(get_repos)</text>

  <line x1="425" y1="260" x2="590" y2="260" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="507" y="253" text-anchor="middle" fill="#9ca3af" font-size="10">8. CallToolRequest</text>

  <line x1="595" y1="275" x2="720" y2="275" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="657" y="268" text-anchor="middle" fill="#9ca3af" font-size="10">9. API call</text>

  <!-- Step 10: GitHub -> back -->
  <line x1="720" y1="295" x2="600" y2="295" stroke="#f472b6" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="657" y="311" text-anchor="middle" fill="#9ca3af" font-size="10">10. repos data</text>

  <line x1="590" y1="310" x2="430" y2="310" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="507" y="325" text-anchor="middle" fill="#9ca3af" font-size="10">11. CallToolResult</text>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5068"/>
    </marker>
  </defs>
</svg>
